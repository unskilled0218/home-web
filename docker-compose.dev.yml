services:
  app:
    image: git.lan/dev/npm:latest
    container_name: home-web
    stdin_open: true
    tty: true
    network_mode: host
    working_dir: /home/container/workdir/home-web
    volumes:
      - ./:/home/container/workdir
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${HOME}/.ssh
        target: /home/container/.ssh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.gitconfig
        target: /home/container/.gitconfig
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/git/token
        target: /home/container/.config/git/token
        read_only: true
        bind:
          create_host_path: false