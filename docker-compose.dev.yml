services:
  app:
    image: git.lan/dev/npm:latest
    container_name: home-web
    stdin_open: true
    tty: true
    environment:
      PW_TEST_CONNECT_WS_ENDPOINT: ws://playwright:3000/
    networks:
      - development
    network_mode: host
    working_dir: /home/container/workdir
    volumes:
      - ./:/home/container/workdir
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${HOME}/.ssh
        target: /home/container/.ssh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.gitconfig
        target: /home/container/.gitconfig
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config/token
        target: /home/container/.config/token
        read_only: true
        bind:
          create_host_path: false

networks:
  development:
    external: true
    name: development