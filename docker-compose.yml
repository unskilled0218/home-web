services:
  dashboard:
    image: ${HOME_WEB_IMAGE:-git.lan/dev/home-web:latest}
    network_mode: host
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/wol.db
      LINKWARDEN_CONFIG_ENCRYPTION_KEY_FILE: ${LINKWARDEN_CONFIG_ENCRYPTION_KEY_FILE:-/app/data/linkwarden-config-encryption.key}
      NFS_MOUNT_PATH: /photos
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
      - ${NFS_HOST_MOUNT_PATH:-./photos}:/photos:ro
    restart: unless-stopped
